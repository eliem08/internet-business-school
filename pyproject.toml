[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-business-school"
version = "0.1.0"
description = "A real education in building an online business, graded on what you ship."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "eliem08" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = ["ruff==0.15.20"]

[project.scripts]
internet-business-school = "internet_business_school.__main__:main"
internet-business-school-web = "internet_business_school.web:main"

[project.urls]
Repository = "https://github.com/eliem08/internet-business-school"

[tool.setuptools]
packages = ["internet_business_school"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF"]
ignore = ["E501", "E741", "SIM108", "RUF001", "RUF002", "RUF003", "RUF022", "B905"]  # E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"internet_business_school/__init__.py" = ["F401", "F403"]
"tests/*" = ["E501"]
