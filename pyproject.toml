[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-business-school"
version = "0.1.0"
description = "Harvard Business School for internet businesses: a real education in building online"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
internet-business-school = "internet_business_school.__main__:main"

[tool.setuptools]
packages = ["internet_business_school"]
